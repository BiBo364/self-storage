services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: self_storage
      POSTGRES_USER: self_storage
      POSTGRES_PASSWORD: self_storage
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U self_storage"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # App chạy trong Docker (tuỳ chọn): docker compose --profile app up -d
  # Dev bình thường chạy `cd backend && ./mvnw spring-boot:run` cho nhanh.
  backend:
    profiles: ["app"]
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Nạp toàn bộ .env của repo (Cloudinary + credential cổng thanh toán là @NotBlank, thiếu là app
    # chết lúc boot). `required: false` để `docker compose up -d` chỉ dựng Postgres/Redis vẫn chạy được
    # khi chưa copy .env. Các biến dưới đây phải trỏ vào mạng Docker nên khai lại để đè giá trị trong .env.
    env_file:
      - path: .env
        required: false
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/self_storage
      DB_USER: self_storage
      DB_PASSWORD: self_storage
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-PT15M}
      # Mail thật qua Gmail SMTP — giá trị lấy từ .env (xem .env.example).
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
    ports:
      - "8080:8080"

volumes:
  postgres-data:
