spring:
  config:
    import: optional:file:../.env[.properties]
  application:
    name: self-storage
  servlet:
    multipart:
      # Module media validate ≤10MB và trả 400 có message; servlet nhận nhỉnh hơn (12MB)
      # để file 10–12MB tới được validator.
      max-file-size: 12MB
      max-request-size: 12MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/self_storage}
    username: ${DB_USER:self_storage}
    password: ${DB_PASSWORD:self_storage}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 1s
  # Gửi mail thật qua Gmail SMTP (App Password) — thông tin đăng nhập nằm trong .env.
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}
            required: ${MAIL_SMTP_STARTTLS:true}
          # SMTP chậm/treo không được giữ request quá lâu (ms).
          connectiontimeout: ${MAIL_TIMEOUT_MS:10000}
          timeout: ${MAIL_TIMEOUT_MS:10000}
          writetimeout: ${MAIL_TIMEOUT_MS:10000}
app:
  mail:
    # Kênh gửi: smtp (mặc định, spring.mail.* ở trên) | brevo (API HTTPS — host chặn cổng SMTP, vd Render gói free).
    provider: ${MAIL_PROVIDER:smtp}
    # Gmail chỉ cho gửi từ chính tài khoản đăng nhập (hoặc alias đã xác minh). Với Brevo: sender đã xác minh trên Brevo.
    from: ${MAIL_FROM:${MAIL_USERNAME:noreply@lemar.vn}}
    from-name: ${MAIL_FROM_NAME:Kho Mộc}
  # Gốc URL frontend để dựng link trong notification/email (vd link xác nhận đề xuất khoang).
  frontend-url: ${FRONTEND_URL:http://localhost:5173}

security:
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT15M}
  password:
    bcrypt-strength: ${BCRYPT_STRENGTH:10}
  email-verification:
    ttl: ${EMAIL_VERIFICATION_TTL:PT10M}
    max-attempts: ${EMAIL_VERIFICATION_MAX_ATTEMPTS:5}
    resend-cooldown: ${EMAIL_VERIFICATION_RESEND_COOLDOWN:PT60S}
  login-rate-limit:
    email-max-attempts: ${LOGIN_RATE_LIMIT_EMAIL_MAX:5}
    ip-max-attempts: ${LOGIN_RATE_LIMIT_IP_MAX:20}
    window: ${LOGIN_RATE_LIMIT_WINDOW:PT15M}

# Giới hạn upload mỗi account (fixed window trên Redis, fail-open khi Redis lỗi).
media:
  upload-rate-limit:
    max-per-window: ${MEDIA_UPLOAD_RATE_MAX:30}
    window: ${MEDIA_UPLOAD_RATE_WINDOW:PT10M}
  # Cron dọn upload Uploading/Pending không đổi quá max-age (asset trên storage bị xoá).
  orphan-cleanup:
    max-age: ${MEDIA_ORPHAN_MAX_AGE:P3D}

# Cổng thanh toán đang dùng: vnpay (mặc định) | payos. Chỉ cổng đang dùng mới bắt buộc đủ credential.
payment:
  provider: ${PAYMENT_PROVIDER:vnpay}

# Brevo — gửi email qua API HTTPS khi app.mail.provider=brevo (bắt buộc api-key khi đó).
brevo:
  api-key: ${BREVO_API_KEY:}
  api-url: ${BREVO_API_URL:https://api.brevo.com/v3/smtp/email}

# payOS (VietQR) — không có sandbox: giao dịch là chuyển khoản thật; không có API hoàn tiền.
payos:
  client-id: ${PAYOS_CLIENT_ID:}
  api-key: ${PAYOS_API_KEY:}
  checksum-key: ${PAYOS_CHECKSUM_KEY:}
  base-url: ${PAYOS_BASE_URL:https://api-merchant.payos.vn}
  # Trang kết quả của FE — FE gọi POST /api/invoices/{id}/payment-check để đối soát.
  return-url: ${PAYOS_RETURN_URL:${FRONTEND_URL:http://localhost:5173}/payments/result}
  cancel-url: ${PAYOS_CANCEL_URL:${FRONTEND_URL:http://localhost:5173}/payments/result}

# VNPay — giá trị thật nằm trong .env của từng người, xem docs/vnpay-testing.md.
# Bắt buộc khi payment.provider = vnpay (mặc định — VnPayGateway kiểm lúc khởi động); để trống khi dùng payOS.
vnpay:
  tmn-code: ${VNPAY_TMN_CODE:}
  hash-secret: ${VNPAY_HASH_SECRET:}
  pay-url: ${VNPAY_PAY_URL:}
  return-url: ${VNPAY_RETURN_URL:}
  # API merchant cho querydr (đối soát) — mặc định sandbox.
  api-url: ${VNPAY_API_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}

# Cloudinary — giá trị thật nằm trong .env của từng người (tài khoản free, không cần thẻ).
# Map tường minh qua placeholder vì key trong .env giữ nguyên dạng CLOUDINARY_NAME.
cloudinary:
  name: ${CLOUDINARY_NAME:}
  key: ${CLOUDINARY_KEY:}
  secret: ${CLOUDINARY_SECRET:}

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    vn.lemar.selfstorage: DEBUG

# Chatbot tư vấn (Google Gemini). Thiếu key → POST /api/chat trả 503, các phần khác chạy bình thường.
chat:
  gemini:
    api-key: ${GEMINI_API_KEY:}
    thinking-level: ${CHAT_THINKING_LEVEL:LOW}
  model: ${CHAT_MODEL:gemini-3.6-flash}
