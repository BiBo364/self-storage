# Giá trị giả cho các test boot full context.
#
# `application.yml` cố tình KHÔNG đặt default cho secret: thiếu env thì app phải chết ngay lúc
# khởi động chứ không phải lỗi giữa chừng khi đang chạy. Nhưng điều đó khiến mọi @SpringBootTest
# cũng chết theo, kể cả test không liên quan gì tới JWT hay thanh toán.
#
# File này chỉ nằm trong test classpath nên không ảnh hưởng lúc chạy thật — fail-fast vẫn nguyên.
# Có nó thì người viết test mới không phải nhớ khai lại secret của module người khác.
#
# Test nào cần giá trị cụ thể thì override bằng @SpringBootTest(properties = ...).

security.jwt.secret=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=

vnpay.tmn-code=TESTTMN1
vnpay.hash-secret=0123456789abcdef0123456789abcdef
vnpay.pay-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.return-url=http://localhost:8080/api/payments/vnpay/return

# payOS (bật bằng payment.provider=payos) — giá trị giả, test không gọi mạng (gateway bị mock hoặc dùng MockRestServiceServer).
payos.client-id=test-client
payos.api-key=test-api-key
payos.checksum-key=test-checksum-key-0123456789abcdef

# Giá trị giả cho module media (CloudinaryProperties @NotBlank). Test không gọi mạng —
# Cloudinary chỉ bị mock trong unit test và không được gọi từ @SpringBootTest.
cloudinary.name=test-cloud
cloudinary.key=test-key
cloudinary.secret=test-secret
# Không để job sửa state tự chạy trong test; test gọi method trực tiếp.
booking.deposit-repair.initial-delay-ms=3600000
# Không để watchdog tự chạy trong test; test gọi service trực tiếp.
payment.pending-watchdog.initial-delay-ms=3600000
# Không để cron no-show tự chạy trong test; test gọi service trực tiếp.
booking.appointment-no-show.initial-delay-ms=3600000

# Mail: test KHÔNG BAO GIỜ được ra SMTP thật. `application.yml` đọc `../.env` của dev — nơi có thể chứa
# Gmail App Password thật — nên ghim SMTP về cổng localhost không ai nghe: gửi lỗi nhanh (connection refused),
# SmtpEmailSender chỉ log, nghiệp vụ không rollback. Test cần kiểm nội dung mail thì @MockBean JavaMailSender.
spring.mail.host=localhost
spring.mail.port=2
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false
spring.mail.properties.mail.smtp.connectiontimeout=2000
app.mail.from=noreply@lemar.vn
# Test kiểm nội dung mail ngay sau khi gọi (MockBean JavaMailSender) → gửi đồng bộ; production gửi nền.
app.mail.async=false

# Cron Flow 1–7 không tự chạy giữa test: context sống lâu, job chạy chen sẽ đổi
# dữ liệu test đang dựng. Test gọi trực tiếp service/job khi cần.
booking.expiry.initial-delay-ms=3600000
handover.overdue.initial-delay-ms=3600000
checkout.maintenance.initial-delay-ms=3600000
overdue.job.initial-delay-ms=3600000
tenancy.return-no-show.initial-delay-ms=3600000
media.orphan-cleanup.initial-delay-ms=3600000
